plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id("org.openapi.generator") version "7.8.0"
	id 'jacoco'
	id 'checkstyle'
    //id "org.sonarqube" version "6.2.0.5505"
    id "org.sonarqube" version "5.1.0.4882"
}

group = 'hep.crest'
version = "6.3.2"

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(23)
	}
}

springBoot {
	// This statement tells the Gradle Spring Boot plugin
	// to generate a file
	// build/resources/main/META-INF/build-info.properties
	// that is picked up by Spring Boot to display
	// via /info endpoint.
	buildInfo()
}

bootJar {
	archiveFileName = 'crest.jar'
}

sourceCompatibility = '23'
targetCompatibility = '23'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	querydsl.extendsFrom annotationProcessor
}
configurations.all {
	exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
	exclude group: 'org.slf4j', module: 'slf4j-simple'
}

checkstyle {
    toolVersion = '10.12.0'
    configFile = file('config/checkstyle/checkstyle.xml')
}

checkstyleMain {
    reports {
        xml.required = true
        xml.outputLocation = file('build/reports/checkstyle/main.xml')
    }
    setExcludes(new HashSet(['**/hep/crest/data/**/Q*java',
							 '**/src/gen/**',
							 '**/hep/crest/data/repositories/externals/*',
							 '**/hep/crest/server/swagger/**',
							 '**/plugins/nats/**',
							 '**/plugin/nats/model/*java']))
}

tasks.withType(Checkstyle) {
	checkstyleTest.enabled = false
	reports {
		xml.required = false
		html.required = true
	}
}

jacocoTestReport {
    dependsOn test
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
					"src/gen/**",
					"hep/crest/server/data/**/Q*.*",
					"hep/crest/server/swagger/api/*",
					"hep/crest/server/swagger/model/*"
			])
		}))
	}
	reports {
		xml.required = true
		csv.required = false
		html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
	}
}

sonar {
    properties {
        property "sonar.projectKey", "crest"
        property "sonar.projectName", "crest"
        property "sonar.qualitygate.wait", true
        property "sonar.coverage.jacoco.xmlReportPaths", layout.buildDirectory.dir("/reports/jacoco/test/jacocoTestReport.xml")
        property "sonar.junit.reportPaths", layout.buildDirectory.dir("/test-results/test")
    }
}

repositories {
	mavenCentral()
}

ext {
	swaggerDirectory = "$rootDir/openapi".toString()
	swaggerSpecDirectory =  "$swaggerDirectory".toString()
	swaggerBundleDirectory = "$swaggerDirectory/bundle".toString()
	swaggerJaxrsTemplateDirectory = "$swaggerDirectory/templates/JavaJaxRs".toString()
}

abstract class OpenApiBundleTask extends DefaultTask {
    @Inject
    abstract ExecOperations getExecOperations()

    @Input
    String swaggerSpecDirectory

    @Input
    String swaggerBundleDirectory

    @TaskAction
    void bundle() {
        // Find redocly in common locations or use PATH
        def redoclyPath = ['/opt/homebrew/bin/redocly', '/usr/local/bin/redocly', 'redocly'].find { path ->
            if (path == 'redocly') return true // fallback to PATH
            new File(path).exists()
        }
        execOperations.exec {
            workingDir swaggerSpecDirectory
            // Include common paths for npm global binaries
            environment 'PATH', "/opt/homebrew/bin:/usr/local/bin:${System.getenv('PATH')}"
            commandLine redoclyPath, 'bundle', '-o', "${swaggerBundleDirectory}/crestApi_all.yml".toString(), "${swaggerSpecDirectory}/crestAtlasApi_all.yml".toString()
        }
    }
}

tasks.register('openApiBundle', OpenApiBundleTask) {
    // Bundle the openapi spec files together, to mitigate a bug with the main openapi generator
    // Bug: https://github.com/OpenAPITools/openapi-generator/issues/1976
    // For this to work, the redocly CLI needs to be installed
    // with e.g: npm install -g @redocly/cli
    def specDir = project.ext.swaggerSpecDirectory
    def bundleDir = project.ext.swaggerBundleDirectory
    inputs.files(fileTree(dir: specDir, include: '**/*.yml'))
    outputs.file("${bundleDir}/crestAtlasApi_all.yml".toString())
    it.swaggerSpecDirectory = specDir
    it.swaggerBundleDirectory = bundleDir
}

openApiGenerate {
	generatorName = "jaxrs-jersey"
	inputSpec = "$swaggerBundleDirectory/crestApi_all.yml".toString()
	outputDir = "$projectDir".toString()
	templateDir = swaggerJaxrsTemplateDirectory
	apiPackage = "hep.crest.server.swagger.api"
	modelPackage = "hep.crest.server.swagger.model"
	configOptions = [
			dateLibrary: "java8",
			hideGenerationTimestamp: "true",
			useJakartaEe: "true"
	]
}

task buildCrestPythonClient(type: org.openapitools.generator.gradle.plugin.tasks.GenerateTask){
	generatorName = "python"
	inputSpec = "$swaggerBundleDirectory/crestApi_all.yml".toString()
	outputDir = "$rootDir/pycrest".toString()
	packageName = "hep.crest.client"
	configOptions = [
			packageVersion: "6.1.0",
			projectName: "hep-crest-client"]

}

task buildCrestMarkdownDoc(type: org.openapitools.generator.gradle.plugin.tasks.GenerateTask){
	generatorName = "markdown"
	inputSpec = "$swaggerBundleDirectory/crestApi_all.yml".toString()
	outputDir = "$rootDir/mddocs".toString()
	packageName = "hep.crest.client"
	configOptions = [
			packageVersion: "5.0.0",
			projectName: "hep-crest-client"]

}

dependencies {
	compileOnly 'org.projectlombok:lombok:1.18.34'
	annotationProcessor 'org.projectlombok:lombok:1.18.34'
	// Mappper
	implementation 'org.mapstruct:mapstruct:1.6.2'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'
	// Lombok-MapStruct Binding
	implementation 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	// QueryDSL
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta' // QueryDSL for JPA
	annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	// Spring Boot
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// implementation 'org.springframework.boot:spring-boot-starter-data-rest'
// Exclude default Tomcat
	implementation('org.springframework.boot:spring-boot-starter-web') {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
	}
	// Add Undertow as the embedded server
	implementation 'org.springframework.boot:spring-boot-starter-undertow'

	implementation ('org.springframework.boot:spring-boot-starter-jersey'){
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
	}
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation('org.springframework.boot:spring-boot-starter-oauth2-client')
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// Jackson libraries
	implementation "com.fasterxml.jackson.jakarta.rs:jackson-jakarta-rs-json-provider:2.18.3"
	implementation group: 'org.glassfish.jersey.media', name: 'jersey-media-multipart', version: '3.1.0'
	// Keycloak
	// implementation 'org.keycloak:keycloak-spring-boot-starter:22.0.1'
	// Hibernate
	// Hibernate Core
	implementation 'org.hibernate:hibernate-core:6.5.3.Final' // Adjust to your Hibernate version
	implementation 'org.hibernate:hibernate-jpamodelgen:6.5.3.Final' // For JPA model generation, if needed

    // Logstash
    implementation("net.logstash.logback:logstash-logback-encoder:7.4")

    // Swagger
	implementation group: 'io.swagger.core.v3', name: 'swagger-annotations', version: '2.2.7'
	implementation group: 'io.swagger.core.v3', name: 'swagger-models', version: '2.2.7'
	implementation 'org.apache.commons:commons-text:1.10.0'

    // Caching
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

	implementation 'com.oracle.database.jdbc:ojdbc11'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.h2database:h2'  // Add H2 database dependency
	runtimeOnly 'net.logstash.logback:logstash-logback-encoder:7.4'

	testImplementation "org.mockito:mockito-inline:+"
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'  // Add H2 database dependency
	testImplementation 'org.projectlombok:lombok:1.18.34'
	testImplementation "org.testcontainers:testcontainers:1.20.4"
	testImplementation 'com.redis:testcontainers-redis:2.2.2'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(Checkstyle) {
    reports {
        xml.required = true
        html.required = true
    }
}

sourceSets {
	main {
		java {
			// srcDirs = ['src/main/java', 'src/gen/java']
			srcDirs = ['src/main/java', 'src/gen/java', 'plugins/timeseries/java', 'plugins/tzero/java']
		}
	}
	// println main.output.classesDir
	test {
		java {
			srcDirs = ['src/test/java']
		}
	}
}

// Clean files and directories used for unit testing
task purgedb(type: Delete) {
	delete fileTree('/tmp') {
		include 'crest*.db'
		include 'crest*sqlite*'
	}
}


test {
    dependsOn purgedb
    finalizedBy jacocoTestReport
}


variables:
    IMAGE: crest21-service
    VERSION: '6.2'
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

# Make the gradle wrapper executable. This essentially downloads a copy of
# Gradle to build the project with.
# https://docs.gradle.org/current/userguide/gradle_wrapper.html
# It is expected that any modern gradle project has a wrapper
before_script:
  - chmod +x gradlew

include:
  - project : 'ci-tools/container-image-ci-templates'
    file : 'kaniko-image.gitlab-ci.yml'
    ref: master
  - project : 'atlas-devops/ci-templates'
    file : 'helm/helm.yml'
    ref: main

stages:
 - package_application
 #- build
 - build-sonar
 - push

package_cern_application:
  stage: package_application
  environment: cern
  image: registry.cern.ch/docker.io/eclipse-temurin:23-alpine
  services:
    - registry.cern.ch/docker.io/redis:latest
  variables:
    REDIS_HOST: redis
    REDIS_PORT: 6379
  cache:
    key:
      files:
        - ${GRADLE_USER_HOME}/wrapper/gradle-wrapper.properties
    paths:
      - ${GRADLE_USER_HOME}/caches/
      - ${GRADLE_USER_HOME}/notifications/
      - ${GRADLE_USER_HOME}/wrapper/
  script:
    - export GRADLE_USER_HOME=/cache/.gradle
    - ./gradlew clean build jacocoTestReport
  allow_failure: false
  artifacts:
    paths:
      - ./build/libs/crest.jar
      - ./build/classes
      - ./build/reports/jacoco/test/jacocoTestReport.xml
    expire_in: 1 week

# Can be used to test packaging helm chart, before merging to master for instance
#build_helm:
#  extends: .deploy_helm
#  stage: build
#  variables:
#    REGISTRY_CHART_PATH: registry.cern.ch/crest/charts


build_container_job:
  rules:
    - if: $DO_DOCKER_IMAGE == "yes" && $CI_PIPELINE_SOURCE != 'merge_request_event' && $SITE == "cern"
  environment: cern
  stage: push
  extends: .build_kaniko
  variables:
    REGISTRY_IMAGE_PATH : "registry.cern.ch/crest/$IMAGE:$VERSION"
    CONTEXT_DIR: ""
    PUSH_IMAGE: "true"
    DOCKER_FILE_NAME: "Dockerfile"

build-sonar:
  stage: build-sonar
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script:
    - sonar-scanner -X
      -Dsonar.host.url="${SONAR_HOST_URL}"
      -Dproject.settings=sonar-project.properties
      -Dsonar.projectKey="${CI_PROJECT_NAME}"
      -Dsonar.projectName="${CI_PROJECT_NAME}"
      -Dsonar.token="${SONAR_TOKEN}"
      -Dsonar.qualitygate.timeout=300
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'develop'

push_helm:
  extends: .deploy_helm
  stage: push
  variables:
    REGISTRY_CHART_PATH: registry.cern.ch/crest/charts
    PUSH_CHART: "true"


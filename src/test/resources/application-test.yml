# ===============================
# = PROFILES /
#             datasources
#             ...
# ===============================
crest:
  dumpdir: /tmp
  schemaname: none
  security: none
  synchro: none
  webstaticdir: /tmp
  dbfile: /tmp/crestdbh2web
  apiname: /crestapi
  authenticationtype: none
server:
  servlet.path: /
  connection-timeout: 60s
 # Set maximum request body size to 400MB (default is 10MB)
  # This applies to both Tomcat and Undertow
  tomcat:
    max-http-post-size: 419430400  # 400MB in bytes
  undertow:
    max-http-post-size: 419430400  # 400MB in bytes


spring:
  data.redis:
    host: redis
    port: 6379
  security:
      strategy: MODE_INHERITABLETHREADLOCAL
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 400MB
      location: ${java.io.tmpdir}/crest-multipart
  jersey:
      application-path: /crestapi
  datasource:
    main:
      jdbcUrl: jdbc:h2:/tmp/crestdbh2web;DB_CLOSE_ON_EXIT=FALSE
      driverClassName: org.h2.Driver
      username: root
      password: root
      hikari:
        connection-test-query: SELECT 1
        maximum-pool-size: 2
    trigger:
      jdbcUrl: jdbc:h2:/tmp/triggdbh2web;DB_CLOSE_ON_EXIT=FALSE
      driverClassName: org.h2.Driver
      username: root
      password: root
      hikari:
        connection-test-query: SELECT 1
        maximum-pool-size: 2
  jpa:
      properties:
        hibernate.dialect: org.hibernate.dialect.H2Dialect
        hibernate.jdbc.fetch_size: 100
        hibernate.hbm2ddl.auto: update
        hibernate.show_sql: false
        hibernate.physical_naming_strategy: hep.crest.server.config.DynamicPhysicalNamingStrategy
info:
  app:
    name: Crest Application
    description: Rest services for conditions data management 
    profile: test


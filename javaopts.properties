logging.config=./logback.xml
crest.log.dir=/tmp
crest.runlumiinfo-table=RUN_LUMI_INFO
management.endpoints.web.base-path=/mgmt
management.endpoints.web.exposure.include=health,info,metrics,loggers,heapdump
management.endpoint.health.show-details=always
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.heapdump.enabled=true
management.health.defaults.enabled=false
management.health.db.enabled=true
management.health.diskSpace.enabled=true

# MIME Parser Configuration - Prevent OutOfMemoryError on large uploads
# Sets the threshold (in bytes) for when MIME parts are spilled to disk
# Default is 10MB - parts larger than this won't load into memory
jvnet.mimepull.threshold=10485760

# Jersey Multipart Configuration - Stream large parts to disk
# This complements the configuration in jersey-multipart-config.properties
# Ensure large files (200MB+) are streamed to temp directory instead of memory
jersey.config.multipart.bufferThreshold=20971520

# Undertow buffer sizes - optimize for large file uploads
io.undertow.io.buffer.size=65536
io.undertow.websocket.buffer.size=65536

# Server request size configuration - Allow 3GB uploads
# Note: This is primarily configured via spring.servlet.multipart.max-request-size
# but we set these as well for explicit control

# Undertow configuration (3GB = 3221225472 bytes)
server.undertow.max-http-post-size=3221225472
server.undertow.max-headers=500000
server.undertow.buffer-size=65536

# Tomcat configuration (3GB = 3145728000 bytes) - in case Tomcat is used
server.tomcat.max-http-post-size=3145728000
server.tomcat.max-swallow-size=3145728000


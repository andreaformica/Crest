# Test configuration for triggerdb profile
# Uses H2 embedded database to simulate Oracle TriggerDB

spring.datasource.trigger.jdbc-url=jdbc:h2:mem:triggerdb_test;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.trigger.driver-class-name=org.h2.Driver
spring.datasource.trigger.username=sa
spring.datasource.trigger.password=


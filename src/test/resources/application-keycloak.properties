# Test configuration for keycloak profile
# Uses mock values since we don't have a real Keycloak server

crest.keycloak.url=http://localhost:8180
crest.keycloak.realm=test-realm
crest.keycloak.client=crest-server
crest.keycloak.secret=test-secret

# Security setting
crest.security=none

# Disable the actual JWT issuer validation for testing
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/test-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/test-realm/protocol/openid-connect/certs


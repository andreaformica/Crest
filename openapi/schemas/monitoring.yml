components:
  schemas:
    PayloadTagInfoDto:
      type: object
      properties:
        tagname:
          type: string
        niovs:
          type: integer
        minsince:
          type: integer
          format: int64
        maxsince:
          type: integer
          format: int64
        totvolume:
          type: number
          format: float
        avgvolume:
          type: number
          format: float
    PayloadTagInfoSetDto:
      description: An PayloadTagInfoSet containing PayloadTagInfoDto objects.
      allOf:
        - $ref: 'common.yml#/components/schemas/CrestBaseResponse'
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/PayloadTagInfoDto'

# Jersey Multipart Configuration
# This configuration prevents OutOfMemoryError by streaming large uploads to disk

# Buffer threshold in bytes (5MB)
# Parts smaller than this stay in memory, larger parts are streamed to disk
# This is critical for handling large multipart uploads (200MB+)
jersey.config.multipart.bufferThreshold = 5242880

# Maximum size for multipart entity (400MB)
# Increase if you need to support larger uploads
jersey.config.multipart.max.message.size = 419430400

# Memory threshold for MIME parser (1MB)
# When parsing multipart data, chunks larger than this are written to disk
mimepull.threshold = 1048576

# Temp directory for spilled parts (uses system default if not set)
# jersey.config.server.multipart.location = ${java.io.tmpdir}/jersey-multipart

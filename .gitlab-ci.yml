
variables:
    IMAGE: crest21-service
    VERSION: "6.2.2"
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

# Make the gradle wrapper executable. This essentially downloads a copy of
# Gradle to build the project with.
# https://docs.gradle.org/current/userguide/gradle_wrapper.html
# It is expected that any modern gradle project has a wrapper

include:
  - project : 'ci-tools/container-image-ci-templates'
    file : 'kaniko-image.gitlab-ci.yml'
    ref: master
  - project : 'atlas-devops/ci-templates'
    file : 'helm/helm.yml'
    ref: main
  - project: "atlas-devops/ci-templates"
    ref: main
    file: "sonarqube/sonarqube.yml"
stages:
 - package_application
 - sonar
 - build-docker
 - push

package_cern_application:
  stage: package_application
  environment: cern
  image: registry.cern.ch/docker.io/eclipse-temurin:23-alpine
  services:
    - registry.cern.ch/docker.io/redis:latest
  variables:
    REDIS_HOST: redis
    REDIS_PORT: 6379
  cache:
    key:
      files:
        - ${GRADLE_USER_HOME}/wrapper/gradle-wrapper.properties
    paths:
      - ${GRADLE_USER_HOME}/caches/
      - ${GRADLE_USER_HOME}/notifications/
      - ${GRADLE_USER_HOME}/wrapper/
  script:
    - export GRADLE_USER_HOME=/cache/.gradle
    - ./gradlew -gradle-user-home ${GRADLE_USER_HOME} clean build jacocoTestReport
  allow_failure: false
  artifacts:
    paths:
      - ./build/libs/crest.jar
      - ./build/classes
      - ./build/reports/jacoco/test/jacocoTestReport.xml
      - ./build/reports/checkstyle/main.xml
    expire_in: 1 week
  rules:
    - when: always

# Can be used to test packaging helm chart, before merging to master for instance
#build_helm:
#  extends: .deploy_helm
#  stage: build
#  variables:
#    REGISTRY_CHART_PATH: registry.cern.ch/crest/charts


build_container_job:
  environment: cern
  stage: build-docker
  extends: .build_kaniko
  needs:
    - job: package_cern_application
      artifacts: true
  variables:
    REGISTRY_IMAGE_PATH : "registry.cern.ch/crest/$IMAGE:$VERSION"
    CONTEXT_DIR: ""
    PUSH_IMAGE: "true"
    DOCKER_FILE_NAME: "Dockerfile"
  rules:
    - if: $DO_DOCKER_IMAGE == "yes" && $SITE == "cern" && $CI_COMMIT_BRANCH == 'master'
    - when: never

sonarqube:
  extends: .sonarqube

push_helm:
  extends: .deploy_helm
  stage: push
  variables:
    REGISTRY_CHART_PATH: registry.cern.ch/crest/charts
    PUSH_CHART: "true"
  before_script:
    - git fetch origin master
    - |
      if ! git branch --contains "$CI_COMMIT_SHA" | grep -q 'master'; then
        echo "Tag $CI_COMMIT_TAG does not point to master, skipping push_helm"
        exit 0
      fi
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never

